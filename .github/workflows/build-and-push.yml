name: Build, push and deploy (staging)

on:
  push:
    branches: [staging]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - "ref-image/**"
  workflow_dispatch:

# Prevent two concurrent runs of this workflow from racing to push :staging.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE: kkdev82/icare-app-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Two tags per build:
          #   :staging              floating  → compose tracks this
          #   :staging-sha-<short>  immutable → use to roll back manually
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     22
          # Forward Docker Hub credentials into the remote shell so we don't
          # depend on a persistent `docker login` on the server.
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          # Pull the freshly-pushed :staging image, recreate the container
          # only if its digest changed, then garbage-collect dangling images.
          script: |
            set -euo pipefail
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cd /srv/deploy/icare/icare-app-dashboard
            docker compose pull dashboard
            docker compose up -d
            docker image prune -f
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
