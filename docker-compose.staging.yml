# Staging compose for icare-dashboard-ui (Next.js 16).
# Pulls pre-built image from Docker Hub (private) — does NOT build locally.
#
# On the VPS, place at:
#   /srv/deploy/icare/icare-app-dashboard/docker-compose.yml
# alongside a .env file (see .env.example) which Compose auto-loads
# — currently empty, but the file should exist so Compose doesn't warn.
#
# Tag strategy:
#   :staging              ← floating tag the compose tracks
#   :staging-sha-<short>  ← immutable per-commit tag for rollback
#
# Prereq: icare-app-api stack must already be running (provides `icare-app-api`
# container on the `web` network, used as API_PROXY_TARGET).
#
# First run on server (one-time):
#   docker login                # Docker Hub
#   docker compose pull
#   docker compose up -d
#
# Subsequent deploys are performed by the GitHub Actions "deploy" job via SSH.

services:
  dashboard:
    image: kkdev82/icare-app-dashboard:staging
    container_name: icare-app-dashboard
    restart: unless-stopped
    # No `ports:` — central nginx accesses via shared `web` network.
    environment:
      NODE_ENV: production
      PORT:     "3000"
      HOSTNAME: "0.0.0.0"
      # /api/* is proxied by nginx (see nginx/conf.d/icare-dashboard.*).
      # No need to expose the backend URL to the dashboard container.
    volumes:
      # Static mobile-flow page mounted into Next.js `public/` so it's served
      # at /mobile-flow/index.html (no rebuild needed). `:ro` = read-only.
      # Host path is relative to this compose file on the VPS, i.e.
      #   /srv/deploy/icare/icare-app-dashboard/mobile-flow
      - ./mobile-flow:/app/public/mobile-flow:ro
    networks:
      - web

networks:
  web:
    external: true
